{% extends 'base.html' %}

{% block title %}{{ post.titulo }} - Meu Blog{% endblock %}

{% block content %}
<article style="background: white; padding: 2rem; border-radius: 5px;">
    <h2>{{ post.titulo }}</h2>
    <p style="color: #666; margin-bottom: 1rem;">
        Publicado em: {{ post.data_publicacao|date:"d/m/Y H:i" }}
    </p>
    <div>
        {{ post.conteudo|linebreaks }}
    </div>
    <a href="{% url 'EBAC:index' %}" style="display: inline-block; margin-top: 1rem; color: #007bff;">← Voltar</a>
</article>
{% endblock %}
